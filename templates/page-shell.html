<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{PAGE_TITLE}}</title>
    <link rel="stylesheet" href="{{CSS_PATH}}">
    <style>
        :root {
            --ink: #1b1b1b;
            --muted: #5a5149;
            --accent: #8b4513;
            --border: #e8e0d5;
            --card: #fffdfb;
            --bg: #f4efe8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.7;
        }

        .site-wrap {
            max-width: 820px;
            margin: 0 auto;
            padding: 0 1rem 3rem;
        }

        .post-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 1rem 1.2rem 1.6rem;
            box-shadow: 0 10px 30px rgba(20, 15, 10, 0.05);
        }

        .author-row {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            margin: 0.2rem 0 0.9rem;
        }

        .author-row img {
            width: 72px;
            height: 72px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid var(--border);
            flex-shrink: 0;
        }

        .author-info {
            flex: 1;
            min-width: 0;
        }

        .author-info strong {
            display: block;
            font-size: 1.08rem;
        }

        .author-info span {
            display: block;
            font-size: 0.82rem;
            color: var(--muted);
            margin-top: 0.1rem;
        }

        .author-row nav {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-left: auto;
            justify-content: flex-end;
            flex-wrap: nowrap;
        }

        .author-row nav a {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .eyebrow {
            margin: 0 0 0.35rem;
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent);
        }

        h1 {
            font-size: 1.7rem;
            line-height: 1.25;
            margin: 0 0 0.6rem;
            color: #2b1c12;
        }

        .intro {
            margin: 0 0 1.2rem;
            color: var(--muted);
            font-size: 0.98rem;
        }

        .site-footer {
            text-align: center;
            color: var(--muted);
            font-size: 0.82rem;
            margin-top: 1.5rem;
            padding-top: 0.8rem;
            border-top: 1px solid var(--border);
        }

        @media (max-width: 600px) {
            .author-row {
                flex-wrap: wrap;
            }

            .author-row nav {
                width: 100%;
                justify-content: flex-end;
                margin-left: 0;
            }
        }
    </style>
</head>

<body>
    <div class="site-wrap">
        <article class="post-card">
            {{BODY_CONTENT}}
        </article>
    </div>
</body>

</html>
