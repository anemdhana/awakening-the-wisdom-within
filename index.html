<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Awakenining the wisdom within</title>
  <link rel="stylesheet" href="css/site.css">
  <style>
    :root {
      --sidebar-w: 260px;
      --top-h: 64px;
      --ink: #2a241f;
      --ink-muted: #56483a;
      --accent: #ba7a3a;
      --accent-dark: #8a5a2b;
      --heading: #6e4a25;
      --card: rgba(255, 252, 247, 0.95);
      --side-bg: rgba(255, 248, 238, 0.96);
      --border: rgba(186, 122, 58, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, #f7e7cf 0, #f7e7cf 18%, transparent 19%),
        linear-gradient(135deg, #f6efe6 0%, #efe2d1 45%, #e2d2bb 100%);
      min-height: 100vh;
    }

    .app {
      display: grid;
      grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
      grid-template-areas:
        "topbar topbar"
        "sidebar main";
      max-width: 1280px;
      margin: 0 auto;
    }

    .topbar {
      grid-area: topbar;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      height: 54px;
      padding: 0 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 248, 238, 0.9);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }

    .org-switcher {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      margin-right: 10px;
    }

    .org-button {
      appearance: none;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.84);
      border-radius: 10px;
      padding: 5px 9px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--ink);
      cursor: pointer;
      font-family: Georgia, serif;
      font-size: 12px;
      line-height: 1.2;
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
    }

    .org-button:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .org-button.active {
      background: #2c1810;
      color: #f8efe4;
      border-color: #2c1810;
      box-shadow: 0 4px 12px rgba(44, 24, 16, 0.12);
    }

    .org-button img {
      width: 18px;
      height: 18px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.08));
    }

    .brand {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.03em;
      color: var(--heading);
      text-decoration: none;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand small {
      display: block;
      font-weight: 400;
      font-size: 11px;
      color: var(--ink-muted);
      letter-spacing: 0;
    }

    .lang-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .lang-pills button {
      font-family: Georgia, serif;
      font-size: 12.5px;
      padding: 6px 11px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--ink-muted);
      cursor: pointer;
      line-height: 1.1;
    }

    .lang-pills button.active {
      background: #2c1810;
      color: #f5ebe0;
      border-color: #2c1810;
    }

    .menu-toggle {
      display: none;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 16px;
    }

    .sidebar {
      grid-area: sidebar;
      background: var(--side-bg);
      border-right: 1px solid var(--border);
      padding: 16px 10px 28px;
    }

    .nav-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent-dark);
      padding: 4px 12px 10px;
      font-weight: 700;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      height: 58px;
      text-align: left;
      border: none;
      background: transparent;
      padding: 11px 12px;
      border-radius: 10px;
      cursor: pointer;
      color: var(--ink);
      font-family: Georgia, serif;
      font-size: 14px;
      margin-bottom: 4px;
      transition: background 0.15s, color 0.15s;
    }

    .nav-item:hover {
      background: rgba(186, 122, 58, 0.1);
    }

    .nav-item.active {
      background: #2c1810;
      color: #f8efe4;
    }

    .nav-item .icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
      background: rgba(186, 122, 58, 0.12);
    }

    .nav-item.active .icon {
      background: rgba(255, 255, 255, 0.12);
    }

    .nav-item small {
      display: block;
      font-size: 11px;
      opacity: 0.75;
      margin-top: 1px;
    }

    .main {
      grid-area: main;
      padding: 18px 18px 40px;
      min-width: 0;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .chip {
      appearance: none;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.85);
      border-radius: 999px;
      padding: 6px 12px;
      font-family: Georgia, serif;
      font-size: 12.5px;
      color: var(--ink-muted);
      cursor: pointer;
    }

    .chip.active {
      background: #2c1810;
      color: #f5ebe0;
      border-color: #2c1810;
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      box-shadow: 0 6px 18px rgba(90, 60, 20, 0.04);
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
      box-shadow: 0 10px 24px rgba(90, 60, 20, 0.08);
    }

    .card h3 {
      margin: 0 0 4px;
      font-size: 1.05rem;
      color: var(--heading);
    }

    .card p {
      margin: 0;
      font-size: 0.9rem;
      color: var(--ink-muted);
    }

    .card .meta {
      margin-top: 8px;
      font-size: 11px;
      color: var(--accent-dark);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .empty {
      padding: 28px 12px;
      text-align: center;
      color: var(--ink-muted);
      font-size: 0.95rem;
    }

    .search-wrap {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
    }

    .search-wrap input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
      font-family: Georgia, serif;
      font-size: 14px;
      background: #fff;
      color: var(--ink);
    }

    .viewer {
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    .viewer.active {
      display: flex;
    }

    .viewer-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .viewer-toolbar button,
    .viewer-toolbar a {
      appearance: none;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 8px;
      padding: 7px 12px;
      font-family: Georgia, serif;
      font-size: 13px;
      color: var(--ink);
      cursor: pointer;
      text-decoration: none;
    }

    .viewer-toolbar a {
      color: var(--accent-dark);
      font-size: 12px;
      text-decoration: none;
    }

    .viewer iframe {
      width: 100%;
      height: calc(100vh - 160px);
      border: 0;
      background: #fff;
    }

    .list-view.hidden,
    .filters.hidden {
      display: none;
    }

    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-areas:
          "topbar"
          "main";
      }

      .sidebar {
        display: none;
      }

      .search-wrap {
        flex-wrap: wrap;
      }

      .menu-toggle {
        display: inline-flex;
      }

      .sidebar.open {
        display: block;
        position: fixed;
        top: 54px;
        left: 0;
        bottom: 0;
        width: min(280px, 85vw);
        z-index: 20;
        box-shadow: 8px 0 24px rgba(0, 0, 0, 0.12);
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
      <div class="brand-wrap">
        <div class="org-switcher" id="orgSwitcher" aria-label="Organization selector">
          <button type="button" class="org-button active" data-org="pssm" aria-label="PSSM">
            <img src="assets/logos/pssm-logo.svg" alt="PSSM logo" onerror="this.style.display='none'">
            PSSM
          </button>
          <button type="button" class="org-button" data-org="soulcast" aria-label="Soulcast">
            <img src="assets/logos/soulcast-logo.svg" alt="Soulcast logo" onerror="this.style.display='none'">
            Soulcast
          </button>
          <button type="button" class="org-button" data-org="qlu" aria-label="QLU">
            <img src="assets/logos/qlu-logo.svg" alt="QLU logo" onerror="this.style.display='none'">
            QLU
          </button>
          <button type="button" class="org-button" data-org="tiw" aria-label="Temple of Inner Wisdom">
            <img src="assets/logos/tiw-logo-responsive.svg" alt="Temple of Inner Wisdom logo" onerror="this.style.display='none'">
            TIW
          </button>
          <button type="button" class="org-button" data-org="maitri" aria-label="Maitri Bodh">
            <img src="https://scontent.fmaa9-1.fna.fbcdn.net/v/t39.30808-1/299600325_603813538060256_2716781792230094510_n.jpg?stp=dst-jpg_tt6&cstp=mx640x640&ctp=s200x200&_nc_cat=110&_nc_map=urlgen_bucketless&ccb=1-7&_nc_sid=2d3e12&_nc_ohc=pwq25JY3JXgQ7kNvwFqkbVK&_nc_oc=AdoqdrxSxvHwMGB_z9gCce2HixAJ83_o8KgWjGz3kp6Jmf0Y6OSxsiXT5DzjcyP1QID4RLsFAhGAVCtIdnOGA9ut&_nc_zt=24&_nc_ht=scontent.fmaa9-1.fna&_nc_gid=9F9HZ5yniZUJC4mblGZa_g&_nc_ss=7b2a8&oh=00_AQLj53I2pRgEWWBPAruDRSPqawcN_x6KJ77KcISALvInTw&oe=6AADF9C7" alt="Maitri Bodh logo" onerror="this.style.display='none'">
            Maitri
          </button>
        </div>
        <a class="brand" href="./">
          <span id="brandTitle">Awakening the Wisdom Within</span>
          <small id="brandSub">Spiritual study notes &amp; discourses</small>
        </a>
      </div>
      <div class="lang-pills" id="langPills" role="group" aria-label="Language">
        <button type="button" data-lang="all" class="active">All</button>
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="hi">HI</button>
        <button type="button" data-lang="te">TE</button>
        <button type="button" data-lang="ta">TA</button>
      </div>
    </header>

    <aside class="sidebar" id="sidebar">
      <div class="nav-label">Collections</div>
      <button class="nav-item active" data-section="patriji">
        <span class="icon">◆</span>
        <span>Patriji Teachings<small>Guiding principles &amp; pyramid</small></span>
      </button>
      <button class="nav-item" data-section="book">
        <span class="icon">◆</span>
        <span>Book Reading<small>Swadhyaya notes</small></span>
      </button>
      <button class="nav-item" data-section="sajjana">
        <span class="icon">◆</span>
        <span>Sajjana Sangathya<small>Conversations with Masters</small></span>
      </button>
      <button class="nav-item" data-section="classes">
        <span class="icon">◆</span>
        <span>Session Classes<small>Teachings</small></span>
      </button>
      <button class="nav-item" data-section="discussions">
        <span class="icon">◆</span>
        <span>Discussions<small>Q&amp;A and reflections</small></span>
      </button>
      <button class="nav-item" data-section="soulcast">
        <span class="icon">◆</span>
        <span>Soulcast<small>Shreans Daga Foundation</small></span>
      </button>
      <button class="nav-item" data-section="schedules">
        <span class="icon">◆</span>
        <span>Session Schedules<small>Programmes &amp; resources</small></span>
      </button>
      <button class="nav-item" data-section="maitri">
        <span class="icon">◆</span>
        <span>Maitri Bodh<small>Messages &amp; reflections</small></span>
      </button>
      <button class="nav-item" data-section="messages">
        <span class="icon">◆</span>
        <span>Festival Messages<small>Deeper messages to understand</small></span>
      </button>
    </aside>

    <main class="main">
      <div class="filters" id="filters"></div>
      <div class="list list-view" id="list"></div>

      <div class="viewer" id="viewer">
        <div class="viewer-toolbar">
          <button type="button" id="backBtn">← Back to list</button>
          <a id="openNew" href="#" target="_blank" rel="noopener">Open in new tab</a>
        </div>
        <iframe id="frame" title="Content viewer"></iframe>
      </div>
    </main>
  </div>

  <script src="data/catalog.js"></script>
  <script>
    (function () {
      const DATA = window.PSSM_CATALOG || {};

      const META = {
        patriji: {
          title: "Patriji Teachings",
          desc: "Wisdom of PSSM Masters"
        },
        book: {
          title: "Book Reading (Swadhyaya)",
          desc: "Book Reading Notes"
        },
        sajjana: {
          title: "Sajjana Sangathya",
          desc: "Conversations with Masters and seekers"
        },
        classes: {
          title: "Session Classes",
          desc: "Teachings"
        },
        discussions: {
          title: "Discussions",
          desc: "Discussions and Q&A"
        },
        schedules: {
          title: "Session Schedules",
          desc: "Session Schedules and knowledge resources"
        },
        soulcast: {
          title: "Shreans Daga Foundation",
          desc: "Teaching and meditation resources from Shreans Daga Foundation"
        },
        maitri: {
          title: "Maitri Bodh",
          desc: "Messages and reflections from Maitri Bodh"
        },
        messages: {
          title: "Festival Messages",
          desc: "Deeper messages to understand"
        }
      };

      const ORG_CONFIG = {
        pssm: {
          visibleSections: ["patriji", "book", "sajjana", "classes", "discussions", "soulcast", "schedules"],
          defaultSection: "patriji"
        },
        soulcast: {
          visibleSections: ["soulcast"],
          defaultSection: "soulcast"
        },
        qlu: {
          visibleSections: ["classes"],
          defaultSection: "classes"
        },
        tiw: {
          visibleSections: ["messages"],
          defaultSection: "messages"
        },
        maitri: {
          visibleSections: ["maitri"],
          defaultSection: "maitri"
        }
      };

      const LANG_LABEL = { en: "EN", hi: "HI", te: "TE", ta: "TA" };

      let currentOrg = "pssm";
      let currentSection = "patriji";
      let currentGroup = "all";
      let currentQuery = "";

      const el = {
        orgSwitcher: document.getElementById("orgSwitcher"),
        sidebar: document.getElementById("sidebar"),
        filters: document.getElementById("filters"),
        list: document.getElementById("list"),
        viewer: document.getElementById("viewer"),
        frame: document.getElementById("frame"),
        backBtn: document.getElementById("backBtn"),
        openNew: document.getElementById("openNew"),
        searchInput: document.getElementById("searchInput"),
        brandTitle: document.getElementById("brandTitle"),
        brandSub: document.getElementById("brandSub")
      };

      function setOrg(org) {
        currentOrg = org;
        const visible = ORG_CONFIG[currentOrg].visibleSections;
        document.querySelectorAll(".org-button").forEach(btn => {
          btn.classList.toggle("active", btn.dataset.org === currentOrg);
        });
        document.querySelectorAll(".nav-item").forEach(btn => {
          const show = visible.includes(btn.dataset.section);
          btn.style.display = show ? "" : "none";
        });
        // brand text
        if (currentOrg === "tiw") {
          el.brandTitle.textContent = "Temple of Inner Wisdom";
          el.brandSub.textContent = "Festival messages & deeper invitations";
        } else if (currentOrg === "soulcast") {
          el.brandTitle.textContent = "Soulcast";
          el.brandSub.textContent = "Shreans Daga Foundation";
        } else if (currentOrg === "maitri") {
          el.brandTitle.textContent = "Maitri Bodh";
          el.brandSub.textContent = "Messages and reflections";
        } else if (currentOrg === "qlu") {
          el.brandTitle.textContent = "QLU";
          el.brandSub.textContent = "Session classes";
        } else {
          el.brandTitle.textContent = "Awakening the Wisdom Within";
          el.brandSub.textContent = "Spiritual study notes & discourses";
        }
      }

      function parseUrl() {
        const params = new URLSearchParams(location.search);
        const o = (params.get("org") || "").toLowerCase();
        const s = (params.get("section") || "").toLowerCase();
        if (o === "qlu" || o === "tiw" || o === "pssm" || o === "maitri" || o === "soulcast") currentOrg = o;
        if (s && META[s]) {
          currentSection = s;
        } else {
          currentSection = ORG_CONFIG[currentOrg].defaultSection;
        }
      }

      function updateUrl() {
        const params = new URLSearchParams();
        params.set("org", currentOrg);
        params.set("section", currentSection);
        history.replaceState(null, "", "?" + params.toString());
      }

      function showList() {
        el.filters.classList.remove("hidden");
        el.list.classList.remove("hidden");
        el.viewer.classList.remove("active");
        el.frame.src = "about:blank";
      }

      function showViewer(href, title) {
        el.filters.classList.add("hidden");
        el.list.classList.add("hidden");
        el.viewer.classList.add("active");
        el.frame.src = href;
        el.openNew.href = href;
        el.openNew.textContent = "Open in new tab";
      }

      function render() {
        const items = (DATA[currentSection] || []).slice();
        const groups = Array.from(new Set(items.map(i => i.group || "Other")));

        // filters
        el.filters.innerHTML = "";
        const allChip = document.createElement("button");
        allChip.className = "chip" + (currentGroup === "all" ? " active" : "");
        allChip.textContent = "All";
        allChip.onclick = () => { currentGroup = "all"; render(); };
        el.filters.appendChild(allChip);
        groups.forEach(g => {
          const chip = document.createElement("button");
          chip.className = "chip" + (currentGroup === g ? " active" : "");
          chip.textContent = g;
          chip.onclick = () => { currentGroup = g; render(); };
          el.filters.appendChild(chip);
        });

        // list
        el.list.innerHTML = "";
        const q = currentQuery.trim().toLowerCase();
        const filtered = items.filter(item => {
          if (currentGroup !== "all" && (item.group || "Other") !== currentGroup) return false;
          if (!q) return true;
          const hay = ((item.search || "") + " " + (item.title || "") + " " + (item.sub || "")).toLowerCase();
          return hay.includes(q);
        });

        if (!filtered.length) {
          el.list.innerHTML = '<div class="empty">No items match your search.</div>';
          return;
        }

        filtered.forEach(item => {
          const card = document.createElement("a");
          card.className = "card";
          card.href = item.href;
          card.innerHTML = "<h3>" + (item.title || "") + "</h3><p>" + (item.sub || "") + "</p><div class=\"meta\">" + (item.group || "") + (item.lang ? " · " + (LANG_LABEL[item.lang] || item.lang.toUpperCase()) : "") + "</div>";
          card.onclick = (e) => {
            e.preventDefault();
            showViewer(item.href, item.title);
          };
          el.list.appendChild(card);
        });
      }

      // events
      document.querySelectorAll(".org-button").forEach(btn => {
        btn.addEventListener("click", () => {
          setOrg(btn.dataset.org);
          currentSection = ORG_CONFIG[currentOrg].defaultSection;
          currentGroup = "all";
          document.querySelectorAll(".nav-item").forEach(n => {
            n.classList.toggle("active", n.dataset.section === currentSection);
          });
          updateUrl();
          showList();
          render();
        });
      });

      document.querySelectorAll(".nav-item").forEach(btn => {
        btn.addEventListener("click", () => {
          currentSection = btn.dataset.section;
          currentGroup = "all";
          document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
          btn.classList.add("active");
          updateUrl();
          showList();
          render();
        });
      });

      if (el.backBtn) {
        el.backBtn.addEventListener("click", () => {
          showList();
        });
      }

      const menuToggle = document.getElementById("menuToggle");
      if (menuToggle) {
        menuToggle.addEventListener("click", () => {
          el.sidebar.classList.toggle("open");
        });
      }

      // lang pills — optional filter by language if present on items
      document.querySelectorAll("#langPills button").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("#langPills button").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          const lang = btn.dataset.lang;
          currentQuery = lang === "all" ? "" : lang;
          // simple approach: use search field semantics via currentQuery on lang code in haystack
          render();
        });
      });

      // init
      parseUrl();
      setOrg(currentOrg);
      document.querySelectorAll(".nav-item").forEach(n => {
        n.classList.toggle("active", n.dataset.section === currentSection);
      });
      updateUrl();
      showList();
      render();
    })();
  </script>
</body>

</html>
