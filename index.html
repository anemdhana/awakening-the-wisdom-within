<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PSSM Swadhyaya Notes · Pyramid Spiritual Societies Movement</title>
  <link rel="stylesheet" href="css/site.css">
  <style>
    :root {
      --sidebar-w: 260px;
      --top-h: 64px;
      --ink: #2a241f;
      --ink-muted: #56483a;
      --accent: #ba7a3a;
      --accent-dark: #8a5a2b;
      --heading: #6e4a25;
      --card: rgba(255,252,247,0.95);
      --side-bg: rgba(255,248,238,0.96);
      --border: rgba(186,122,58,0.22);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, #f7e7cf 0, #f7e7cf 18%, transparent 19%),
        linear-gradient(135deg, #f6efe6 0%, #efe2d1 45%, #e2d2bb 100%);
      min-height: 100vh;
    }
    .app {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      grid-template-rows: var(--top-h) 1fr;
      min-height: 100vh;
      max-width: 1280px;
      margin: 0 auto;
    }
    .topbar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 18px;
      background: rgba(255,252,247,0.9);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .brand {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.03em;
      color: var(--heading);
      text-decoration: none;
      line-height: 1.25;
    }
    .brand span {
      display: block;
      font-size: 11px;
      font-weight: 400;
      color: var(--ink-muted);
    }
    .lang-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .lang-pills button {
      font-family: Georgia, serif;
      font-size: 12.5px;
      padding: 6px 11px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--ink-muted);
      cursor: pointer;
    }
    .lang-pills button.active {
      background: #2c1810;
      color: #f5ebe0;
      border-color: #2c1810;
    }
    .menu-toggle {
      display: none;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 16px;
    }
    .sidebar {
      background: var(--side-bg);
      border-right: 1px solid var(--border);
      padding: 16px 10px 28px;
      overflow-y: auto;
    }
    .nav-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent-dark);
      padding: 4px 12px 10px;
      font-weight: 700;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-align: left;
      border: none;
      background: transparent;
      padding: 11px 12px;
      border-radius: 10px;
      cursor: pointer;
      color: var(--ink);
      font-family: Georgia, serif;
      font-size: 14px;
      margin-bottom: 4px;
      transition: background 0.15s, color 0.15s;
    }
    .nav-item:hover { background: rgba(186,122,58,0.1); }
    .nav-item.active {
      background: #2c1810;
      color: #f8efe4;
    }
    .nav-item .ico {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
      background: rgba(186,122,58,0.12);
    }
    .nav-item.active .ico { background: rgba(255,255,255,0.12); }
    .nav-item small {
      display: block;
      font-size: 11px;
      opacity: 0.75;
      margin-top: 1px;
    }
    .main {
      padding: 18px 20px 40px;
      overflow-y: auto;
    }
    .pane-head {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .pane-head h1 {
      margin: 0;
      font-size: 1.45rem;
      color: var(--heading);
    }
    .pane-head p {
      margin: 4px 0 0;
      color: var(--ink-muted);
      font-size: 14px;
    }
    .search-box {
      position: relative;
      width: min(100%, 340px);
    }
    .search-box input {
      width: 100%;
      padding: 11px 14px 11px 38px;
      font-size: 14.5px;
      font-family: Georgia, serif;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255,255,255,0.9);
      color: var(--ink);
      outline: none;
    }
    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(186,122,58,0.15);
    }
    .search-box .sico {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--accent);
      pointer-events: none;
    }
    .group-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 18px 0 10px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--accent);
    }
    .group-title span {
      background: rgba(186,122,58,0.12);
      color: var(--accent-dark);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .cards { display: grid; gap: 8px; }
    .item-card {
      display: block;
      padding: 13px 15px;
      border-radius: 12px;
      text-decoration: none;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--ink);
      transition: border-color 0.15s, background 0.15s;
    }
    .item-card:hover {
      border-color: var(--accent);
      background: rgba(255,252,247,0.98);
    }
    .item-card.featured {
      border-color: var(--accent);
      background: rgba(255,248,235,0.95);
      box-shadow: 0 2px 8px rgba(186,122,58,0.1);
    }
    .item-card strong {
      display: block;
      font-size: 14.5px;
      color: var(--heading);
      margin-bottom: 2px;
    }
    .item-card em {
      font-style: normal;
      font-size: 13px;
      color: var(--ink-muted);
      line-height: 1.4;
    }
    .lang-tag {
      display: inline-block;
      margin-left: 6px;
      font-size: 10px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(186,122,58,0.12);
      color: var(--accent-dark);
      vertical-align: middle;
    }
    .empty {
      text-align: center;
      padding: 36px 16px;
      color: var(--ink-muted);
      font-size: 14.5px;
      display: none;
    }
    .empty.show { display: block; }
    .footer-note {
      margin-top: 28px;
      font-size: 12.5px;
      color: var(--ink-muted);
      text-align: center;
    }
    @media (max-width: 820px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: var(--top-h) auto 1fr;
      }
      .menu-toggle { display: inline-flex; }
      .sidebar {
        display: none;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      .sidebar.open { display: block; }
      .main { padding: 14px 14px 32px; }
      .search-box { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
      <a class="brand" href="index.html">PSSM Swadhyaya Notes
        <span>Pyramid Spiritual Societies Movement</span>
      </a>
      <div class="lang-pills" id="langPills" role="group" aria-label="Language">
        <button type="button" class="active" data-lang="all">All</button>
        <button type="button" data-lang="en">English</button>
        <button type="button" data-lang="hi">हिन्दी</button>
        <button type="button" data-lang="te">తెలుగు</button>
        <button type="button" data-lang="ta">தமிழ்</button>
      </div>
    </header>

    <aside class="sidebar" id="sidebar">
      <div class="nav-label">Collections</div>
      <button class="nav-item active" data-section="patriji">
        <span class="ico" aria-hidden="true">🪔</span>
        <span>Patriji Teachings<small>18 principles · pyramid wisdom</small></span>
      </button>
      <button class="nav-item" data-section="book">
        <span class="ico" aria-hidden="true">📖</span>
        <span>Book Reading (Swadhyaya)<small>Ramtha · Soul’s Journey</small></span>
      </button>
      <button class="nav-item" data-section="sajjana">
        <span class="ico" aria-hidden="true">🤝</span>
        <span>Sajjana Sangathya<small>Transformation journeys</small></span>
      </button>
      <button class="nav-item" data-section="classes">
        <span class="ico" aria-hidden="true">🎓</span>
        <span>Session Classes<small>Newton · Premnath · Gita</small></span>
      </button>
      <button class="nav-item" data-section="schedules">
        <span class="ico" aria-hidden="true">🗓️</span>
        <span>Session Schedules<small>21-day · Kids chanting</small></span>
      </button>
    </aside>

    <main class="main">
      <div class="pane-head">
        <div>
          <h1 id="paneTitle">Patriji Teachings</h1>
          <p id="paneDesc">Brahmarshi Patriji · guiding principles and pyramid teachings</p>
        </div>
        <div class="search-box">
          <span class="sico">⌕</span>
          <input type="search" id="searchInput" placeholder="Search in this collection…" autocomplete="off">
        </div>
      </div>
      <div id="results"></div>
      <div class="empty" id="empty">No matching pages. Try another language or keyword.</div>
      <p class="footer-note">PSSM Swadhyaya Notes · GitHub Pages · Pyramid Spiritual Societies Movement</p>
    </main>
  </div>

  <script src="data/catalog.js"></script>
  <script>
  (function () {
    const DATA = window.PSSM_CATALOG || {};

    const META = {
      patriji: {
        title: "Patriji Teachings",
        desc: "Brahmarshi Patriji · 18 guiding principles, pyramid power & practical guidelines"
      },
      book: {
        title: "Book Reading (Swadhyaya)",
        desc: "Ramtha · A Soul’s Journey — study notes from sacred reading"
      },
      sajjana: {
        title: "Sajjana Sangathya",
        desc: "Transformation Journeys — lived stories of change and sangha"
      },
      classes: {
        title: "Session Classes",
        desc: "Dr. Newton Kondaveti · Brahmarshi Premnath · Gita sessions"
      },
      schedules: {
        title: "Session Schedules",
        desc: "21-Day Meditation with Music (PMMA) · 7-Day Kids Chanting"
      }
    };

    const LANG_LABEL = { en: "EN", hi: "HI", te: "TE", ta: "TA" };

    let section = "patriji";
    let lang = "all";
    let query = "";

    const resultsEl = document.getElementById("results");
    const emptyEl = document.getElementById("empty");
    const paneTitle = document.getElementById("paneTitle");
    const paneDesc = document.getElementById("paneDesc");
    const searchInput = document.getElementById("searchInput");
    const sidebar = document.getElementById("sidebar");

    function render() {
      const meta = META[section];
      paneTitle.textContent = meta.title;
      paneDesc.textContent = meta.desc;
      searchInput.placeholder = "Search in " + meta.title + "…";

      const items = DATA[section] || [];
      const q = query.trim().toLowerCase();
      const filtered = items.filter(it => {
        const langOk = lang === "all" || it.lang === lang;
        const textOk = !q || (it.search || "").includes(q) ||
          (it.title || "").toLowerCase().includes(q) ||
          (it.sub || "").toLowerCase().includes(q) ||
          (it.group || "").toLowerCase().includes(q);
        return langOk && textOk;
      });

      resultsEl.innerHTML = "";
      if (!filtered.length) {
        emptyEl.classList.add("show");
        return;
      }
      emptyEl.classList.remove("show");

      const groups = {};
      filtered.forEach(it => {
        const g = it.group || "General";
        if (!groups[g]) groups[g] = [];
        groups[g].push(it);
      });

      const order = Object.keys(groups).sort((a, b) => {
        const rank = (g) => {
          if (/18 Guiding/i.test(g)) return 0;
          if (/Ramtha/i.test(g)) return 1;
          if (/Soul/i.test(g)) return 2;
          if (/DrNewton|Newton/i.test(g)) return 1;
          if (/Premnath/i.test(g)) return 2;
          if (/21-Day/i.test(g)) return 1;
          if (/7-Day/i.test(g)) return 2;
          if (g === "General") return 9;
          return 5;
        };
        return rank(a) - rank(b) || a.localeCompare(b);
      });

      order.forEach(g => {
        const block = document.createElement("div");
        const gt = document.createElement("p");
        gt.className = "group-title";
        gt.innerHTML = g + ' <span>' + groups[g].length + '</span>';
        block.appendChild(gt);
        const cards = document.createElement("div");
        cards.className = "cards";
        groups[g].forEach(it => {
          const a = document.createElement("a");
          a.className = "item-card" + (it.featured ? " featured" : "");
          a.href = it.href;
          const tag = LANG_LABEL[it.lang] || "EN";
          a.innerHTML =
            "<strong>" + escapeHtml(it.title) +
            ' <span class="lang-tag">' + tag + "</span></strong>" +
            "<em>" + escapeHtml(it.sub || "") + "</em>";
          cards.appendChild(a);
        });
        block.appendChild(cards);
        resultsEl.appendChild(block);
      });
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&")
        .replace(/</g, "<")
        .replace(/>/g, ">")
        .replace(/"/g, """);
    }

    document.querySelectorAll(".nav-item").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        section = btn.getAttribute("data-section");
        searchInput.value = "";
        query = "";
        sidebar.classList.remove("open");
        render();
      });
    });

    document.querySelectorAll("#langPills button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#langPills button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        lang = btn.getAttribute("data-lang");
        render();
      });
    });

    searchInput.addEventListener("input", () => {
      query = searchInput.value;
      render();
    });
    searchInput.addEventListener("search", () => {
      query = searchInput.value;
      render();
    });

    document.getElementById("menuToggle").addEventListener("click", () => {
      sidebar.classList.toggle("open");
    });

    render();
  })();
  </script>
</body>
</html>
